hooks:
  session_start:
    - resolve_today
    - resolve_weather_best_effort
    - read_context_map
    - summarize_state_brief
    - detect_state_change
    - suggest_one_next_action

  preflight_labels:
    - check_pokit_labels
    - plan_missing_label_creation
    - require_user_approval

  before_each_issue:
    - load_issue_context
    - resolve_labels
    - check_existing_artifact
    - check_content_hash

  before_implementation:
    - require_linear_cycle_or_approved_bundle
    - allow_planning_and_dry_run_without_cycle
    - block_durable_file_changes_without_cycle_context

  after_artifact:
    - require_korean_first_user_copy
    - allow_english_only_for_identifiers_and_product_terms
    - validate_frontmatter
    - record_content_hash
    - validate_artifact_path

  before_user_facing_artifact:
    - require_korean_first_user_copy
    - allow_english_only_for_identifiers_and_product_terms
    - reject_english_prose_without_user_request

  before_external_write:
    - require_dry_run_plan
    - require_user_approval
    - require_idempotency_key

  before_public_release:
    enforcement: script
    runner: scripts/release-preflight.ts
    gates:
      - id: release_md_audit
        severity: blocker
        requires:
          - target_version
      - id: public_safety_scan
        severity: blocker
      - id: full_tests
        severity: blocker
      - id: git_diff_check
        severity: blocker
      - id: git_status_check
        severity: blocker
      - id: ignored_evidence_scan
        severity: warning

  after_run:
    - write_run_summary
    - update_current_cycle
    - update_context_map
    - update_resume_brief

  after_completion_report:
    - include_verification_result
    - include_latest_commit_when_available
    - include_one_next_action
    - reject_mechanical_next_action
    - prefer_cycle_level_next_action

  after_cycle_complete:
    - verify_todo_zero
    - verify_in_progress_zero
    - verify_approval_pending_zero
    - verify_clarification_zero
    - show_completion_celebration_once
    - include_run_summary_link
    - include_retro_link
    - suggest_next_cycle_action

  on_error:
    - collect_error
    - write_failure_summary
